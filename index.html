<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Caderno</title>
    <style>
        :root {
            --bg-sidebar: #171717;
            --bg-main: #111111;
            --bg-panel: #202020;
            --bg-item: #252525;
            --bg-item-hover: #2B2B2B;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --text-accent-green: #4ADE80;
            --border-color: #333333;
            --accent: #3B82F6;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- COLUNA 1: SIDEBAR ESQUERDA --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            padding: 0 20px 20px 20px;
            gap: 12px;
        }
        .user-profile img {
            width: 40px; height: 40px; border-radius: 50%;
        }
        .user-profile-info {
            display: flex; flex-direction: column;
        }
        .user-profile-info strong { font-size: 0.9em; }
        .user-profile-info span { font-size: 0.75em; color: var(--text-secondary); }
        
        .search-bar {
            margin: 0 20px 15px 20px;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85em;
            display: flex; gap: 8px; align-items: center;
        }
        
        .nav-list { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9em;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .nav-item:hover { background-color: var(--bg-item-hover); }
        .nav-item.active { background-color: var(--bg-item-hover); color: var(--text-primary); border-left: 3px solid var(--accent); }
        
        .divider { height: 1px; background-color: var(--border-color); margin: 15px 20px; }
        .nav-title { font-size: 0.75em; color: var(--text-secondary); margin: 0 20px 10px 20px; font-weight: bold; text-transform: uppercase; }

        /* --- COLUNA 2: ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .main-header {
            padding: 30px 40px 10px 40px;
        }
        .main-header h1 {
            margin: 0; font-size: 1.8em; font-weight: 600;
        }
        .main-header .date-subtitle {
            font-size: 0.85em; color: var(--text-secondary); margin-top: 5px;
        }

        .task-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 40px 20px 40px;
        }

        .task-item {
            background-color: var(--bg-item);
            border-radius: 5px;
            padding: 12px 16px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .task-item:hover { background-color: var(--bg-item-hover); }
        .task-item.selected { border-color: var(--border-color); background-color: var(--bg-item-hover); }
        
        .task-circle {
            width: 18px; height: 18px; border: 1.5px solid var(--text-secondary); border-radius: 50%;
            flex-shrink: 0; cursor: pointer;
        }
        .task-circle:hover { border-color: white; }
        
        .task-title-text { flex: 1; font-size: 0.95em; }
        .task-star { color: var(--text-secondary); font-size: 1.2em; cursor: pointer; }

        /* Input para Nova Tarefa */
        .add-task-container {
            padding: 20px 40px;
            background-color: var(--bg-main);
        }
        .add-task-box {
            background-color: var(--bg-item);
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        .add-task-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 15px 10px;
            font-size: 0.95em;
            outline: none;
        }
        .add-task-box input::placeholder { color: var(--text-secondary); }

        /* --- VISUALIZAÇÃO DE AGENDA (CALENDÁRIO) --- */
        .agenda-container {
            display: none;
            flex: 1;
            padding: 10px 40px 20px 40px;
            flex-direction: column;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header button {
            background: var(--bg-item); border: 1px solid var(--border-color); color: white;
            padding: 8px 15px; border-radius: 5px; cursor: pointer;
        }
        .calendar-header button:hover { background: var(--bg-item-hover); }
        .calendar-header h2 { margin: 0; font-size: 1.4em; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .calendar-day-header {
            text-align: center; font-weight: bold; color: var(--text-secondary); padding-bottom: 10px;
        }
        .calendar-day {
            background-color: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            min-height: 100px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .calendar-day.empty { background-color: transparent; border-color: transparent; }
        .calendar-day.today { border-color: var(--accent); }
        .calendar-date-number { font-size: 0.9em; font-weight: bold; margin-bottom: 8px; color: var(--text-secondary); }
        .calendar-day.today .calendar-date-number { color: var(--accent); }
        .calendar-event {
            background-color: var(--bg-item-hover);
            border-left: 3px solid var(--accent);
            font-size: 0.75em;
            padding: 4px 6px;
            margin-bottom: 4px;
            border-radius: 0 4px 4px 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- COLUNA 3: PAINEL DE DETALHES --- */
        .details-panel {
            width: 360px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
        }
        .details-panel.active { display: flex; }

        .details-top-bar {
            padding: 10px 15px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border-color);
        }
        .btn-close-details { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2em; padding: 0; }
        .btn-close-details:hover { color: white; }

        .details-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .details-block {
            background-color: var(--bg-item);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .details-block-header { padding: 15px; }
        .details-title-row {
            display: flex; align-items: flex-start; gap: 15px; margin-bottom: 15px;
        }
        .details-title-input {
            flex: 1; background: transparent; border: none; color: white;
            font-size: 1.1em; font-weight: 600; outline: none; resize: none; font-family: inherit;
        }
        
        /* Ajuste do CSS para impedir o corte de texto */
        .details-row {
            padding: 14px 15px; 
            min-height: 52px; /* Garante espaço vertical suficiente */
            display: flex; align-items: center; gap: 15px;
            font-size: 0.9em; line-height: 1.4; color: var(--text-secondary); 
            cursor: pointer; border-bottom: 1px solid var(--border-color);
            position: relative;
        }
        .details-row:last-child { border-bottom: none; }
        .details-row:hover { background-color: var(--bg-item-hover); color: var(--text-primary); }
        .details-icon { font-size: 1.2em; width: 20px; text-align: center; }
        
        .row-text-content { flex: 1; display: flex; flex-direction: column; pointer-events: none; }
        .row-text-main { color: var(--text-primary); }
        .text-green { color: var(--text-accent-green) !important; }
        
        .btn-clear-row { 
            background: none; border: none; color: var(--text-secondary); font-size: 1.1em; cursor: pointer; 
            z-index: 10; position: relative; display: none;
        }
        .details-row:hover .btn-clear-row { display: block; }
        .btn-clear-row:hover { color: white; }

        /* Anotações e Comentários */
        .add-note-box textarea {
            width: 100%; background-color: transparent; border: none;
            color: white; font-family: inherit; font-size: 0.9em;
            resize: vertical; min-height: 40px; outline: none;
        }
        .add-note-box textarea::placeholder { color: var(--text-secondary); }
        
        .btn-save-note {
            background-color: var(--bg-item-hover); border: 1px solid var(--border-color); color: white;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; float: right; margin-top: 5px;
        }
        .btn-save-note:hover { background-color: var(--border-color); }

        .comments-section-title { font-size: 0.8em; color: var(--text-secondary); text-transform: uppercase; margin: 15px 0 10px 0; font-weight: bold; }
        .comments-display {
            font-size: 0.9em; line-height: 1.5; color: var(--text-primary); margin-bottom: 5px;
            white-space: pre-wrap; padding: 10px; background-color: rgba(0,0,0,0.15); border-radius: 4px;
        }

        .anexos-list { display: flex; flex-direction: column; gap: 8px; padding: 0 15px 15px 15px; }
        .anexo-item { font-size: 0.85em; color: var(--accent); text-decoration: none; word-break: break-all; }
        .anexo-item:hover { text-decoration: underline; }

        .details-footer {
            padding: 15px 20px; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8em; color: var(--text-secondary);
        }
        .btn-delete { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2em; }
        .btn-delete:hover { color: var(--danger); }

        /* Esconder input nativo sobrepondo o elemento inteiro */
        .hidden-date-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; cursor: pointer; z-index: 5;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-header { padding: 20px; }
            .task-list-container { padding: 10px 20px; }
            .add-task-container { padding: 15px 20px; }
            .agenda-container { padding: 10px 20px; }
            .details-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; z-index: 100; }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=Alirio+Toledo&background=21324D&color=fff" alt="Perfil">
            <div class="user-profile-info">
                <strong>Alirio Toledo</strong>
                <span>aliriotoledo@...</span>
            </div>
        </div>
        <div class="search-bar">
            🔍 <span>Pesquisar</span>
        </div>
        <ul class="nav-list">
            <li class="nav-item" id="navMeuDia" onclick="alternarAba('caderno')">☀️ Meu Dia</li>
            <li class="nav-item" id="navAgenda" onclick="alternarAba('agenda')">📅 Agenda</li>
            <li class="nav-item">⭐ Importante</li>
            <li class="nav-item">📅 Planejado</li>
            <li class="nav-item active" id="navCaderno" onclick="alternarAba('caderno')">📝 Meu Caderno</li>
        </ul>
        <div class="divider"></div>
        <div class="nav-title">Comercial</div>
        <ul class="nav-list">
            <li class="nav-item">🔴 Grupo HFC</li>
            <li class="nav-item">🔵 T.I</li>
            <li class="nav-item">🟠 Data7</li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="main-header">
            <h1 id="mainTitle">Meu Caderno</h1>
            <div class="date-subtitle" id="relogioCabecalho"></div>
        </header>

        <!-- VISUALIZAÇÃO PADRÃO: LISTA -->
        <div class="task-list-container" id="listaAnotacoes"></div>
        <div class="add-task-container" id="addAnotacaoBar">
            <div class="add-task-box">
                <div class="task-circle" style="border-color: transparent; font-size: 1.2em; color: var(--text-secondary);">+</div>
                <input type="text" id="novaAtividade" placeholder="Adicionar uma tarefa" onkeypress="verificarEnter(event)">
            </div>
        </div>

        <!-- VISUALIZAÇÃO: AGENDA / CALENDÁRIO -->
        <div class="agenda-container" id="agendaView">
            <div class="calendar-header">
                <button onclick="mudarMes(-1)">◀ Anterior</button>
                <h2 id="mesAnoAtual">Outubro 2026</h2>
                <button onclick="mudarMes(1)">Próximo ▶</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header">Dom</div>
                <div class="calendar-day-header">Seg</div>
                <div class="calendar-day-header">Ter</div>
                <div class="calendar-day-header">Qua</div>
                <div class="calendar-day-header">Qui</div>
                <div class="calendar-day-header">Sex</div>
                <div class="calendar-day-header">Sáb</div>
            </div>
            <div class="calendar-grid" id="calendarioDias"></div>
        </div>
    </main>

    <aside class="details-panel" id="detailsPanel"></aside>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnIk5cQwljtWvEcvyvsZ-gejfMIpggx3Q",
            authDomain: "meu-caderno-app.firebaseapp.com",
            projectId: "meu-caderno-app",
            storageBucket: "meu-caderno-app.appspot.com",
            messagingSenderId: "237821420171",
            appId: "1:237821420171:web:063873bdb2e4707a6dea8e",
            measurementId: "G-HVKVB5PBX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let todasAnotacoes = {};
        let atividadeAtivaId = null;
        let dataCalendario = new Date();

        // Alternância de Abas
        window.alternarAba = function(aba) {
            fecharDetalhes();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if (aba === 'agenda') {
                document.getElementById('navAgenda').classList.add('active');
                document.getElementById('mainTitle').textContent = 'Agenda';
                document.getElementById('listaAnotacoes').style.display = 'none';
                document.getElementById('addAnotacaoBar').style.display = 'none';
                document.getElementById('agendaView').style.display = 'flex';
                renderizarCalendario();
            } else {
                document.getElementById('navCaderno').classList.add('active');
                document.getElementById('mainTitle').textContent = 'Meu Caderno';
                document.getElementById('listaAnotacoes').style.display = 'block';
                document.getElementById('addAnotacaoBar').style.display = 'block';
                document.getElementById('agendaView').style.display = 'none';
            }
        };

        function atualizarRelogio() {
            const el = document.getElementById('relogioCabecalho');
            if(!el) return;
            const agora = new Date();
            const opcoesData = { weekday: 'short', day: '2-digit', month: 'short' };
            el.textContent = agora.toLocaleDateString('pt-BR', opcoesData) + ' - ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // Funções do Calendário
        window.mudarMes = function(direcao) {
            dataCalendario.setMonth(dataCalendario.getMonth() + direcao);
            renderizarCalendario();
        };

        function renderizarCalendario() {
            const grid = document.getElementById('calendarioDias');
            grid.innerHTML = '';
            
            const ano = dataCalendario.getFullYear();
            const mes = dataCalendario.getMonth();
            const nomeMes = dataCalendario.toLocaleString('pt-BR', { month: 'long' });
            
            document.getElementById('mesAnoAtual').textContent = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1) + ' ' + ano;

            const primeiroDia = new Date(ano, mes, 1).getDay();
            const ultimoDiaData = new Date(ano, mes + 1, 0).getDate();
            const hoje = new Date();

            for (let i = 0; i < primeiroDia; i++) {
                grid.innerHTML += '<div class="calendar-day empty"></div>';
            }

            for (let dia = 1; dia <= ultimoDiaData; dia++) {
                const isHoje = (dia === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear());
                let eventosHtml = '';
                
                Object.values(todasAnotacoes).forEach(nota => {
                    // Simulação para exibir data de conclusão no calendário
                    if (nota.dataConclusao) {
                        const partes = nota.dataConclusao.split('-');
                        if (parseInt(partes[2]) === dia && parseInt(partes[1]) - 1 === mes && parseInt(partes[0]) === ano) {
                            eventosHtml += `<div class="calendar-event">${nota.titulo}</div>`;
                        }
                    } else if (nota.data) {
                        const dataNota = nota.data.toDate();
                        if (dataNota.getDate() === dia && dataNota.getMonth() === mes && dataNota.getFullYear() === ano) {
                            eventosHtml += `<div class="calendar-event">${nota.titulo}</div>`;
                        }
                    }
                });

                grid.innerHTML += `
                    <div class="calendar-day ${isHoje ? 'today' : ''}">
                        <div class="calendar-date-number">${dia}</div>
                        ${eventosHtml}
                    </div>
                `;
            }
        }

        window.verificarEnter = function(e) {
            if(e.key === 'Enter') adicionarNota();
        }

        window.adicionarNota = async function() {
            const inputTitulo = document.getElementById('novaAtividade');
            const titulo = inputTitulo.value.trim();
            if (!titulo) return;
            inputTitulo.value = '';
            
            await addDoc(collection(db, "anotacoes"), {
                titulo: titulo,
                comentario: "",
                anexos: [],
                arquivado: false,
                data: new Date()
            });
        };

        const q = query(collection(db, "anotacoes"), orderBy("data", "desc"));
        onSnapshot(q, (snapshot) => {
            const lista = document.getElementById('listaAnotacoes');
            lista.innerHTML = '';
            todasAnotacoes = {};
            
            snapshot.forEach((docSnapshot) => {
                const nota = docSnapshot.data();
                if (nota.arquivado) return;
                
                const docId = docSnapshot.id;
                todasAnotacoes[docId] = nota;

                const item = document.createElement('div');
                item.className = `task-item ${docId === atividadeAtivaId ? 'selected' : ''}`;
                item.onclick = () => abrirDetalhes(docId);

                // Mostra ícone se for "Meu Dia"
                const iconeMeuDia = nota.meuDia ? '<span style="color:var(--text-accent-green); margin-right:8px; font-size:1.1em;">☀️</span>' : '';

                item.innerHTML = `
                    <div class="task-circle" onclick="arquivarAtividade('${docId}'); event.stopPropagation();"></div>
                    <div class="task-title-text">${iconeMeuDia}${nota.titulo}</div>
                    <div class="task-star">☆</div>
                `;
                lista.appendChild(item);
            });

            if (document.getElementById('agendaView').style.display === 'flex') {
                renderizarCalendario();
            }

            if (atividadeAtivaId && todasAnotacoes[atividadeAtivaId]) {
                renderizarPainelDetalhes(atividadeAtivaId);
            } else {
                fecharDetalhes();
            }
        });

        window.abrirDetalhes = function(docId) {
            atividadeAtivaId = docId;
            document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            renderizarPainelDetalhes(docId);
            document.getElementById('detailsPanel').classList.add('active');
        };

        window.fecharDetalhes = function() {
            atividadeAtivaId = null;
            document.getElementById('detailsPanel').classList.remove('active');
            document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
        };

        // FUNÇÕES DOS BOTÕES DE AÇÃO
        window.salvarCampo = async function(docId, campo, valor) {
            if(valor !== null) {
                const docRef = doc(db, "anotacoes", docId);
                await updateDoc(docRef, { [campo]: valor });
            }
        };

        window.limparCampo = async function(docId, campo) {
            const docRef = doc(db, "anotacoes", docId);
            await updateDoc(docRef, { [campo]: null });
        };

        window.toggleMeuDia = async function(docId) {
            const nota = todasAnotacoes[docId];
            const docRef = doc(db, "anotacoes", docId);
            await updateDoc(docRef, { meuDia: !nota.meuDia });
        };

        window.atribuirPessoa = async function(docId) {
            const nota = todasAnotacoes[docId];
            const pessoa = prompt("Atribuir esta tarefa a:", nota.atribuidoA || "");
            if (pessoa !== null) {
                salvarCampo(docId, 'atribuidoA', pessoa.trim());
            }
        };

        window.definirRepeticao = async function(docId) {
            const nota = todasAnotacoes[docId];
            const repeticao = prompt("Com que frequência? (ex: Diariamente, Semanalmente)", nota.repetir || "");
            if (repeticao !== null) {
                salvarCampo(docId, 'repetir', repeticao.trim());
            }
        };

        function renderizarPainelDetalhes(docId) {
            const nota = todasAnotacoes[docId];
            const panel = document.getElementById('detailsPanel');
            const dataFormatada = nota.data ? nota.data.toDate().toLocaleDateString('pt-BR') : '';
            
            // Variáveis Dinâmicas para Estados dos Campos
            const meuDiaClass = nota.meuDia ? 'text-green' : '';
            const meuDiaTexto = nota.meuDia ? 'Adicionado a Meu Dia' : 'Adicionar a Meu Dia';

            const lembreteStr = nota.lembrete ? new Date(nota.lembrete).toLocaleString('pt-PT').slice(0, 16) : 'Lembre-me';
            const lembreteClass = nota.lembrete ? 'text-green' : '';

            const dataConclusaoStr = nota.dataConclusao ? new Date(nota.dataConclusao + 'T00:00:00').toLocaleDateString('pt-PT') : 'Adicionar data de conclusão';
            const dataConclusaoClass = nota.dataConclusao ? 'text-green' : '';

            const repetirStr = nota.repetir ? `Repetir: ${nota.repetir}` : 'Repetir';
            const repetirClass = nota.repetir ? 'text-green' : '';

            const atribuidoStr = nota.atribuidoA ? `Atribuído a: ${nota.atribuidoA}` : 'Atribuir a';
            const atribuidoClass = nota.atribuidoA ? 'text-green' : '';

            let anexosHtml = '';
            if (nota.anexos && nota.anexos.length > 0) {
                anexosHtml = nota.anexos.map(item => 
                    `<a href="${item.url}" target="_blank" download="${item.nome}" class="anexo-item">📎 ${item.nome}</a>`
                ).join('');
            }

            const comentarioExibicao = nota.comentario ? `<div class="comments-display">${nota.comentario}</div>` : '';

            panel.innerHTML = `
                <div class="details-top-bar">
                    <button class="btn-close-details" onclick="fecharDetalhes()">✕</button>
                </div>
                
                <div class="details-body">
                    
                    <div class="details-block details-block-header">
                        <div class="details-title-row">
                            <div class="task-circle" style="margin-top: 5px;" onclick="arquivarAtividade('${docId}')"></div>
                            <textarea class="details-title-input" rows="2" onchange="salvarTitulo('${docId}', this.value)">${nota.titulo}</textarea>
                            <div class="task-star">☆</div>
                        </div>
                        <div class="details-row" style="padding: 0; border: none; color: var(--text-accent-green); min-height: auto;">
                            <span class="details-icon" style="font-size: 1.5em; margin-right: 5px;">+</span> Adicionar etapa
                        </div>
                    </div>

                    <!-- Bloco Meu Dia -->
                    <div class="details-block">
                        <div class="details-row" onclick="toggleMeuDia('${docId}')">
                            <span class="details-icon ${meuDiaClass}">☀️</span> 
                            <span class="row-text-main ${meuDiaClass}" style="flex:1;">${meuDiaTexto}</span>
                            ${nota.meuDia ? `<button class="btn-clear-row" onclick="event.stopPropagation(); toggleMeuDia('${docId}')">✕</button>` : ''}
                        </div>
                    </div>

                    <!-- Bloco Data e Hora -->
                    <div class="details-block">
                        <div class="details-row">
                            <input type="datetime-local" class="hidden-date-input" onchange="salvarCampo('${docId}', 'lembrete', this.value)" value="${nota.lembrete || ''}">
                            <span class="details-icon ${lembreteClass}">⏰</span> 
                            <span class="row-text-main ${lembreteClass}" style="flex:1; pointer-events: none;">${lembreteStr}</span>
                            ${nota.lembrete ? `<button class="btn-clear-row" onclick="event.preventDefault(); limparCampo('${docId}', 'lembrete')">✕</button>` : ''}
                        </div>
                        
                        <div class="details-row">
                            <input type="date" class="hidden-date-input" onchange="salvarCampo('${docId}', 'dataConclusao', this.value)" value="${nota.dataConclusao || ''}">
                            <span class="details-icon ${dataConclusaoClass}">📅</span> 
                            <span class="row-text-main ${dataConclusaoClass}" style="flex:1; pointer-events: none;">${dataConclusaoStr}</span>
                            ${nota.dataConclusao ? `<button class="btn-clear-row" onclick="event.preventDefault(); limparCampo('${docId}', 'dataConclusao')">✕</button>` : ''}
                        </div>
                        
                        <div class="details-row" onclick="definirRepeticao('${docId}')">
                            <span class="details-icon ${repetirClass}">🔁</span> 
                            <span class="row-text-main ${repetirClass}" style="flex:1;">${repetirStr}</span>
                            ${nota.repetir ? `<button class="btn-clear-row" onclick="event.stopPropagation(); limparCampo('${docId}', 'repetir')">✕</button>` : ''}
                        </div>
                    </div>

                    <!-- Bloco Atribuir a -->
                    <div class="details-block">
                        <div class="details-row" onclick="atribuirPessoa('${docId}')">
                            <span class="details-icon ${atribuidoClass}">👤</span> 
                            <span class="row-text-main ${atribuidoClass}" style="flex:1;">${atribuidoStr}</span>
                            ${nota.atribuidoA ? `<button class="btn-clear-row" onclick="event.stopPropagation(); limparCampo('${docId}', 'atribuidoA')">✕</button>` : ''}
                        </div>
                    </div>

                    <!-- Bloco Anexos -->
                    <div class="details-block">
                        <div class="details-row" onclick="anexarFicheiro('${docId}')"><span class="details-icon">📎</span> Adicionar arquivo</div>
                        ${anexosHtml ? `<div class="anexos-list">${anexosHtml}</div>` : ''}
                    </div>

                    <!-- Bloco Observações -->
                    <div class="details-block" style="padding: 15px;">
                        <div class="add-note-box">
                            <textarea id="extra-${docId}" placeholder="Adicionar anotação"></textarea>
                        </div>
                        <div style="text-align: right; margin-top: 10px; margin-bottom: 15px;">
                            <button class="btn-save-note" onclick="adicionarComentarioAdicional('${docId}')" style="float: none;">Guardar Observação</button>
                        </div>
                        
                        ${comentarioExibicao ? `
                            <div class="comments-section-title">Comentários Adicionados</div>
                            ${comentarioExibicao}
                        ` : ''}
                    </div>

                </div>

                <div class="details-footer">
                    <span>Criado em ${dataFormatada}</span>
                    <button class="btn-delete" title="Excluir" onclick="excluirAtividade('${docId}')">🗑️</button>
                </div>
            `;
        }

        window.salvarTitulo = async function(docId, novoTitulo) {
            if (novoTitulo.trim() !== "") {
                const docRef = doc(db, "anotacoes", docId);
                await updateDoc(docRef, { titulo: novoTitulo.trim() });
            }
        };

        window.adicionarComentarioAdicional = async function(docId) {
            const textarea = document.getElementById('extra-' + docId);
            const novoTexto = textarea.value.trim();
            if (!novoTexto) return;
            
            const nota = todasAnotacoes[docId];
            const comentarioAntigo = nota.comentario || '';
            const dataAtual = new Date().toLocaleString('pt-BR').slice(0, 16);
            const separador = comentarioAntigo ? "\n\n" : "";
            const textoFinal = comentarioAntigo + separador + "✏️ [" + dataAtual + "] " + novoTexto;
            
            const docRef = doc(db, "anotacoes", docId);
            await updateDoc(docRef, { comentario: textoFinal });
        };

        window.anexarFicheiro = function(docId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { alert("Limite de 2MB por ficheiro."); return; }

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const fileData = { nome: file.name, url: event.target.result };
                    const nota = todasAnotacoes[docId];
                    const anexosAntigos = nota.anexos || [];
                    anexosAntigos.push(fileData);

                    const docRef = doc(db, "anotacoes", docId);
                    await updateDoc(docRef, { anexos: anexosAntigos });
                };
                reader.readAsDataURL(file);
            };
            input.click();
        };

        window.arquivarAtividade = async function(docId) {
            const docRef = doc(db, "anotacoes", docId);
            await updateDoc(docRef, { arquivado: true });
            fecharDetalhes();
        };

        window.excluirAtividade = async function(docId) {
            if (confirm("Deseja excluir permanentemente esta atividade?")) {
                const docRef = doc(db, "anotacoes", docId);
                await deleteDoc(docRef);
                fecharDetalhes();
            }
        };
    </script>
</body>
</html>
