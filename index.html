<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Caderno</title>
    <style>
        :root {
            --bg-sidebar: #171717;
            --bg-main: #111111;
            --bg-panel: #202020;
            --bg-item: #252525;
            --bg-item-hover: #2B2B2B;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --text-accent-green: #4ADE80;
            --border-color: #333333;
            --accent: #3B82F6;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- COLUNA 1: SIDEBAR ESQUERDA --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            padding: 0 20px 20px 20px;
            gap: 12px;
        }
        .user-profile img {
            width: 40px; height: 40px; border-radius: 50%;
        }
        .user-profile-info {
            display: flex; flex-direction: column;
        }
        .user-profile-info strong { font-size: 0.9em; }
        .user-profile-info span { font-size: 0.75em; color: var(--text-secondary); }
        
        .search-bar {
            margin: 0 20px 15px 20px;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85em;
            display: flex; gap: 8px; align-items: center;
        }
        
        .nav-list { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9em;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .nav-item:hover { background-color: var(--bg-item-hover); }
        .nav-item.active { background-color: var(--bg-item-hover); color: var(--text-primary); border-left: 3px solid var(--accent); }
        
        .divider { height: 1px; background-color: var(--border-color); margin: 15px 20px; }
        .nav-title { font-size: 0.75em; color: var(--text-secondary); margin: 0 20px 10px 20px; font-weight: bold; text-transform: uppercase; }

        /* --- COLUNA 2: ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .main-header {
            padding: 30px 40px 10px 40px;
        }
        .main-header h1 {
            margin: 0; font-size: 1.8em; font-weight: 600;
        }
        .main-header .date-subtitle {
            font-size: 0.85em; color: var(--text-secondary); margin-top: 5px;
        }

        /* Container Dinâmico de Vistas */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        #viewAgenda {
            display: none;
            padding: 20px 40px;
            overflow-y: auto;
        }

        /* Calendário */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .cal-header {
            text-align: center; font-weight: bold; padding: 10px; color: var(--text-secondary); font-size: 0.9em; text-transform: uppercase;
        }
        .cal-day {
            background: var(--bg-item); border-radius: 5px; min-height: 100px; padding: 10px; border: 1px solid transparent; cursor: pointer; display: flex; flex-direction: column;
        }
        .cal-day:hover { background: var(--bg-item-hover); border-color: var(--border-color); }
        .cal-day.empty { background: transparent; cursor: default; border: none; }
        .cal-day.hoje { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .day-number { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }

        .task-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 40px 20px 40px;
        }

        .task-item {
            background-color: var(--bg-item); border-radius: 5px; padding: 12px 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent;
        }
        .task-item:hover { background-color: var(--bg-item-hover); }
        .task-item.selected { border-color: var(--border-color); background-color: var(--bg-item-hover); }
        
        .task-circle { width: 18px; height: 18px; border: 1.5px solid var(--text-secondary); border-radius: 50%; flex-shrink: 0; cursor: pointer; }
        .task-circle:hover { border-color: white; }
        .task-title-text { flex: 1; font-size: 0.95em; }
        .task-star { color: var(--text-secondary); font-size: 1.2em; cursor: pointer; }

        /* Input para Nova Tarefa */
        .add-task-container {
            padding: 20px 40px;
            background-color: var(--bg-main);
        }
        .add-task-box {
            background-color: var(--bg-item); border-radius: 5px; display: flex; align-items: center; padding: 0 15px;
        }
        .add-task-box input {
            flex: 1; background: transparent; border: none; color: white; padding: 15px 10px; font-size: 0.95em; outline: none;
        }
        .add-task-box input::placeholder { color: var(--text-secondary); }

        /* --- COLUNA 3: PAINEL DE DETALHES --- */
        .details-panel {
            width: 360px; background-color: var(--bg-panel); border-left: 1px solid var(--border-color); display: none; flex-direction: column;
        }
        .details-panel.active { display: flex; }

        .details-top-bar { padding: 10px 15px; display: flex; justify-content: flex-end; border-bottom: 1px solid var(--border-color); }
        .btn-close-details { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2em; padding: 0; }
        .btn-close-details:hover { color: white; }

        .details-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }

        /* Blocos Agrupados */
        .details-block { background-color: var(--bg-item); border-radius: 5px; overflow: hidden; display: flex; flex-direction: column; }
        .details-block-header { padding: 15px; }
        .details-title-row { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 15px; }
        .details-title-input { flex: 1; background: transparent; border: none; color: white; font-size: 1.1em; font-weight: 600; outline: none; resize: none; font-family: inherit; }
        
        .details-row {
            padding: 12px 15px; display: flex; align-items: center; gap: 15px; font-size: 0.9em; color: var(--text-secondary); cursor: pointer; border-bottom: 1px solid var(--border-color); position: relative;
        }
        .details-row:last-child { border-bottom: none; }
        .details-row:hover { background-color: var(--bg-item-hover); color: var(--text-primary); }
        .details-icon { font-size: 1.2em; width: 20px; text-align: center; }
        
        .row-text-content { flex: 1; display: flex; flex-direction: column; }
        .row-text-main { color: var(--text-primary); }
        .row-text-sub { font-size: 0.85em; color: var(--text-secondary); margin-top: 2px; }
        .text-green { color: var(--text-accent-green); }

        /* Anotações e Comentários */
        .add-note-box textarea {
            width: 100%; background-color: transparent; border: none; color: white; font-family: inherit; font-size: 0.9em; resize: vertical; min-height: 40px; outline: none;
        }
        .add-note-box textarea::placeholder { color: var(--text-secondary); }
        
        .btn-save-note {
            background-color: var(--bg-item-hover); border: 1px solid var(--border-color); color: white; padding: 6px 12px;
