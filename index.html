<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Caderno</title>
    <style>
        :root {
            --bg-sidebar: #171717;
            --bg-main: #111111;
            --bg-panel: #202020;
            --bg-item: #1E1E1E;
            --bg-item-hover: #2B2B2B;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --border-color: #333333;
            --accent: #3B82F6;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- COLUNA 1: SIDEBAR ESQUERDA --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            padding: 0 20px 20px 20px;
            gap: 12px;
        }
        .user-profile img {
            width: 40px; height: 40px; border-radius: 50%;
        }
        .user-profile-info {
            display: flex; flex-direction: column;
        }
        .user-profile-info strong { font-size: 0.9em; }
        .user-profile-info span { font-size: 0.75em; color: var(--text-secondary); }
        
        .search-bar {
            margin: 0 20px 15px 20px;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85em;
            display: flex; gap: 8px; align-items: center;
        }
        
        .nav-list { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9em;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .nav-item:hover { background-color: var(--bg-item-hover); }
        .nav-item.active { background-color: var(--bg-item-hover); color: var(--text-primary); border-left: 3px solid var(--accent); }
        
        .divider { height: 1px; background-color: var(--border-color); margin: 15px 20px; }
        .nav-title { font-size: 0.75em; color: var(--text-secondary); margin: 0 20px 10px 20px; font-weight: bold; text-transform: uppercase; }

        /* --- COLUNA 2: ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .main-header {
            padding: 30px 40px 10px 40px;
        }
        .main-header h1 {
            margin: 0; font-size: 1.8em; font-weight: 600;
        }
        .main-header .date-subtitle {
            font-size: 0.85em; color: var(--text-secondary); margin-top: 5px;
        }

        .task-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 40px 20px 40px;
        }

        /* Item da Lista (Tarefa) */
        .task-item {
            background-color: var(--bg-item);
            border-radius: 5px;
            padding: 12px 16px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .task-item:hover { background-color: var(--bg-item-hover); }
        .task-item.selected { border-color: var(--border-color); background-color: var(--bg-item-hover); }
        
        .task-circle {
            width: 18px; height: 18px; border: 1.5px solid var(--text-secondary); border-radius: 50%;
            flex-shrink: 0;
        }
        .task-title-text { flex: 1; font-size: 0.95em; }
        .task-star { color: var(--text-secondary); font-size: 1.2em; }

        /* Input para Nova Tarefa */
        .add-task-container {
            padding: 20px 40px;
            background-color: var(--bg-main);
        }
        .add-task-box {
            background-color: var(--bg-item);
            border-radius: 5px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        .add-task-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 15px 10px;
            font-size: 0.95em;
            outline: none;
        }
        .add-task-box input::placeholder { color: var(--text-secondary); }
        .btn-add { background: none; border: none; color: var(--text-primary); font-size: 1.5em; cursor: pointer; padding: 10px; }

        /* --- COLUNA 3: PAINEL DE DETALHES (DIREITA) --- */
        .details-panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: none; /* Escondido por padrão */
            flex-direction: column;
        }
        .details-panel.active { display: flex; }

        .details-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .details-title-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            outline: none;
            resize: none;
            font-family: inherit;
        }
        .btn-close-details {
            background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2em; padding: 0;
        }
        .btn-close-details:hover { color: white; }

        .details-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .details-action-btn {
            background-color: var(--bg-item);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            text-align: left;
            font-size: 0.9em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .details-action-btn:hover { background-color: var(--bg-item-hover); }

        .details-section-title { font-size: 0.8em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        
        /* Lista de Anexos no Painel */
        .anexos-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .anexo-item {
            background-color: var(--bg-item); padding: 10px; border-radius: 4px; font-size: 0.85em;
            color: var(--accent); text-decoration: none; word-break: break-all; display: flex; align-items: center; gap: 8px;
        }
        .anexo-item:hover { background-color: var(--bg-item-hover); text-decoration: underline; }

        /* Observações no Painel */
        .comments-display {
            font-size: 0.9em; line-height: 1.5; color: var(--text-primary); margin-bottom: 15px;
            white-space: pre-wrap; background: var(--bg-item); padding: 12px; border-radius: 5px;
        }
        .add-note-box textarea {
            width: 100%; background-color: var(--bg-main); border: 1px solid var(--border-color);
            color: white; padding: 10px; border-radius: 5px; font-family: inherit; font-size: 0.9em;
            resize: vertical; min-height: 60px; outline: none; margin-bottom: 8px;
        }
        .btn-save-note {
            background-color: var(--bg-item); border: 1px solid var(--border-color); color: white;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; float: right;
        }
        .btn-save-note:hover { background-color: var(--bg-item-hover); }

        .details-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8em;
            color: var(--text-secondary);
        }
        .btn-delete { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2em; }
        .btn-delete:hover { color: var(--danger); }

        /* RESPONSIVIDADE PARA TELEMÓVEL */
        @media (max-width: 768px) {
            .sidebar { display: none; } /* Oculta o menu lateral no telemóvel */
            .main-header { padding: 20px; }
            .task-list-container { padding: 10px 20px; }
            .add-task-container { padding: 15px 20px; }
            
            /* Painel de detalhes sobrepõe o ecrã inteiro no telemóvel */
            .details-panel {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                width: 100%;
                z-index: 100;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR ESQUERDA (MOCKUP MS TO DO) -->
    <nav class="sidebar">
        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=Alirio+Toledo&background=21324D&color=fff" alt="Perfil">
            <div class="user-profile-info">
                <strong>Alirio Toledo</strong>
                <span>aliriotoledo@...</span>
            </div>
        </div>
        <div class="search-bar">
            🔍 <span>Pesquisar</span>
        </div>
        <ul class="nav-list">
            <li class="nav-item">☀️ Meu Dia</li>
            <li class="nav-item">⭐ Importante</li>
            <li class="nav-item">📅 Planejado</li>
            <li class="nav-item active">📝 Meu Caderno</li>
        </ul>
        <div class="divider"></div>
        <div class="nav-title">Comercial</div>
        <ul class="nav-list">
            <li class="nav-item">🔴 Grupo HFC</li>
            <li class="nav-item">🔵 T.I</li>
            <li class="nav-item">🟠 Data7</li>
        </ul>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-content">
        <header class="main-header">
            <h1>Meu Caderno</h1>
            <div class="date-subtitle" id="relogioCabecalho"></div>
        </header>

        <div class="task-list-container" id="listaAnotacoes">
            <!-- As atividades serão renderizadas aqui -->
        </div>

        <div class="add-task-container">
            <div class="add-task-box">
                <div class="task-circle" style="border-color: transparent; font-size: 1.2em; color: var(--accent);">+</div>
                <input type="text" id="novaAtividade" placeholder="Adicionar uma tarefa" onkeypress="verificarEnter(event)">
                <button class="btn-add" onclick="adicionarNota()">></button>
            </div>
        </div>
    </main>

    <!-- PAINEL DE DETALHES (DIREITA) -->
    <aside class="details-panel" id="detailsPanel">
        <!-- Conteúdo gerado dinamicamente via JavaScript -->
    </aside>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnIk5cQwljtWvEcvyvsZ-gejfMIpggx3Q",
            authDomain: "meu-caderno-app.firebaseapp.com",
            projectId: "meu-caderno-app",
            storageBucket: "meu-caderno-app.appspot.com",
            messagingSenderId: "237821420171",
            appId: "1:237821420171:web:063873bdb2e4707a6dea8e",
            measurementId: "G-HVKVB5PBX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Estado Global
        let todasAnotacoes = {};
        let atividadeAtivaId = null;

        // Atualizar Relógio
        function atualizarRelogio() {
            const el = document.getElementById('relogioCabecalho');
            if(!el) return;
            const agora = new Date();
            const opcoesData = { weekday: 'short', day: '2-digit', month: 'short' };
            el.textContent = agora.toLocaleDateString('pt-BR', opcoesData) + ' - ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // Atalho tecla Enter
        window.verificarEnter = function(e) {
            if(e.key === 'Enter') adicionarNota();
        }

        // Adicionar Nova Nota
        window.adicionarNota = async function() {
            const inputTitulo = document.getElementById('novaAtividade');
            const titulo = inputTitulo.value.trim();
            if (!titulo) return;
            inputTitulo.value = '';
            
            await addDoc(collection(db, "anotacoes"), {
                titulo: titulo,
                comentario: "",
                anexos: [],
                arquivado: false,
                data: new Date()
            });
        };

        // Escuta em tempo real do Firestore
        const q = query(collection(db, "anotacoes"), orderBy("data", "desc"));
        onSnapshot(q, (snapshot) => {
            const lista = document.getElementById('listaAnotacoes');
            lista.innerHTML = '';
            todasAnotacoes = {};
            
            snapshot.forEach((docSnapshot) => {
                const nota = docSnapshot.data();
                if (nota.arquivado) return;
                
                const docId = docSnapshot.id;
                todasAnotacoes[docId] = nota; // Guarda no estado local

                const item = document.createElement('div');
                item.className = `task-item ${docId === atividadeAtivaId ? 'selected' : ''}`;
                item.onclick = () => abrirDetalhes(docId);

                item.innerHTML = `
                    <div class="task-circle"></div>
                    <div class="task-title-text">${nota.titulo}</div>
                    <div class="task-star">☆</div>
                `;
                lista.appendChild(item);
            });

            // Se o painel de detalhes estiver aberto, atualiza as informações
            if (atividadeAtivaId && todasAnotacoes[atividadeAtivaId]) {
                renderizarPainelDetalhes(atividadeAtivaId);
            } else {
                fecharDetalhes();
            }
        });

        // --- FUNÇÕES DO PAINEL DE DETALHES ---

        window.abrirDetalhes = function(docId) {
            atividadeAtivaId = docId;
            
            // Atualiza classe 'selected' na lista principal
            document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');

            renderizarPainelDetalhes(docId);
            document.getElementById('detailsPanel').classList.add('active');
        };

        window.fecharDetalhes = function() {
            atividadeAtivaId = null;
            document.getElementById('detailsPanel').classList.remove('active');
            document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
        };

        function renderizarPainelDetalhes(docId) {
            const nota = todasAnotacoes[docId];
            const panel = document.getElementById('detailsPanel');
            const dataFormatada = nota.data ? nota.data.toDate().toLocaleDateString('pt-BR') : '';
            
            let anexosHtml = '';
            if (nota.anexos && nota.anexos.length > 0) {
                anexosHtml = nota.anexos.map(item => 
                    `<a href="${item.url}" target="_blank" download="${item.nome}" class="anexo-item">📎 ${item.nome}</a>`
                ).join('');
            } else {
                anexosHtml = '<span style="font-size: 0.85em; color: var(--text-secondary);">Nenhum anexo.</span>';
            }

            const comentarioExibicao = nota.comentario ? `<div class="comments-display">${nota.comentario}</div>` : '';

            panel.innerHTML = `
                <div class="details-header">
                    <div class="task-circle" style="margin-top: 5px;" onclick="arquivarAtividade('${docId}')"></div>
                    <textarea class="details-title-input" rows="2" onchange="salvarTitulo('${docId}', this.value)">${nota.titulo}</textarea>
                    <button class="btn-close-details" onclick="fecharDetalhes()">✕</button>
                </div>
                
                <div class="details-body">
                    <button class="details-action-btn" onclick="anexarFicheiro('${docId}')">
                        📎 Adicionar ficheiro
                    </button>
                    
                    ${nota.anexos && nota.anexos.length > 0 ? `
                        <div class="details-section-title">Anexos</div>
                        <div class="anexos-list">${anexosHtml}</div>
                    ` : ''}

                    <div class="details-section-title" style="margin-top: 20px;">Anotações / Observações</div>
                    ${comentarioExibicao}
                    
                    <div class="add-note-box">
                        <textarea id="extra-${docId}" placeholder="Adicionar uma anotação..."></textarea>
                        <button class="btn-save-note" onclick="adicionarComentarioAdicional('${docId}')">Guardar</button>
                    </div>
                    <div style="clear: both;"></div>
                </div>

                <div class="details-footer">
                    <span>Criado em ${dataFormatada}</span>
                    <button class="btn-delete" title="Excluir" onclick="excluirAtividade('${docId}')">🗑️</button>
                </div>
            `;
        }

        window.salvarTitulo = async function(docId, novoTitulo) {
            if (novoTitulo.trim() !== "") {
                const docRef = doc(db, "anotacoes", docId);
                await updateDoc(docRef, { titulo: novoTitulo.trim() });
            }
        };

        window.adicionarComentarioAdicional = async function(docId) {
            const textarea = document.getElementById('extra-' + docId);
            const novoTexto = textarea.value.trim();
            if (!novoTexto) return;
            
            const nota = todasAnotacoes[docId];
            const comentarioAntigo = nota.comentario || '';
            const dataAtual = new Date().toLocaleString('pt-BR').slice(0, 16);
            const separador = comentarioAntigo ? "\n\n" : "";
            const textoFinal = comentarioAntigo + separador + "✏️ [" + dataAtual + "] " + novoTexto;
            
            const docRef = doc(db, "anotacoes", docId);
            await updateDoc(docRef, { comentario: textoFinal });
        };

        window.anexarFicheiro = function(docId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { alert("Limite de 2MB por ficheiro."); return; }

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const fileData = { nome: file.name, url: event.target.result };
                    const nota = todasAnotacoes[docId];
                    const anexosAntigos = nota.anexos || [];
                    anexosAntigos.push(fileData);

                    const docRef = doc(db, "anotacoes", docId);
                    await updateDoc(docRef, { anexos: anexosAntigos });
                };
                reader.readAsDataURL(file);
            };
            input.click();
        };

        window.arquivarAtividade = async function(docId) {
            const docRef = doc(db, "anotacoes", docId);
            await updateDoc(docRef, { arquivado: true });
            fecharDetalhes();
        };

        window.excluirAtividade = async function(docId) {
            if (confirm("Deseja excluir permanentemente esta atividade?")) {
                const docRef = doc(db, "anotacoes", docId);
                await deleteDoc(docRef);
                fecharDetalhes();
            }
        };
    </script>
</body>
</html>
