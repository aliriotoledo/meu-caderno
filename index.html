<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Caderno</title>
    <style>
        :root {
            --bg-sidebar: #171717;
            --bg-main: #111111;
            --bg-panel: #202020;
            --bg-item: #252525;
            --bg-item-hover: #2B2B2B;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --text-accent-green: #4ADE80;
            --border-color: #333333;
            --accent: #3B82F6;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- COLUNA 1: SIDEBAR ESQUERDA --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            padding: 0 20px 20px 20px;
            gap: 12px;
        }
        .user-profile img {
            width: 40px; height: 40px; border-radius: 50%;
        }
        .user-profile-info {
            display: flex; flex-direction: column;
        }
        .user-profile-info strong { font-size: 0.9em; }
        .user-profile-info span { font-size: 0.75em; color: var(--text-secondary); }
        
        .search-bar {
            margin: 0 20px 15px 20px;
            background: var(--bg-item);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85em;
            display: flex; gap: 8px; align-items: center;
        }
        
        .nav-list { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9em;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .nav-item:hover { background-color: var(--bg-item-hover); }
        .nav-item.active { background-color: var(--bg-item-hover); color: var(--text-primary); border-left: 3px solid var(--accent); }
        
        .divider { height: 1px; background-color: var(--border-color); margin: 15px 20px; }
        .nav-title { font-size: 0.75em; color: var(--text-secondary); margin: 0 20px 10px 20px; font-weight: bold; text-transform: uppercase; }

        /* --- COLUNA 2: ÁREA PRINCIPAL --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .main-header {
            padding: 30px 40px 10px 40px;
        }
        .main-header h1 {
            margin: 0; font-size: 1.8em; font-weight: 600;
        }
        .main-header .date-subtitle {
            font-size: 0.85em; color: var(--text-secondary); margin-top: 5px;
        }

        .task-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 40px 20px 40px;
        }

        .task-item {
            background-color: var(--bg-item);
            border-radius: 5px;
            padding: 12px 16px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
